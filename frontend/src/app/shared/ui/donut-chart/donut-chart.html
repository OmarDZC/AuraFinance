<div class="relative w-36 h-36 flex items-center justify-center flex-shrink-0">
  <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
    <circle
      class="text-surface-container-highest/40"
      cx="50"
      cy="50"
      r="42"
      fill="transparent"
      stroke="currentColor"
      stroke-width="12"
    />
    @for (segment of segments(); track $index) {
      <circle
        [class]="segment.strokeClass"
        cx="50"
        cy="50"
        r="42"
        fill="transparent"
        stroke="currentColor"
        stroke-width="12"
        [attr.stroke-dasharray]="segment.dasharray"
        [attr.stroke-dashoffset]="segment.dashoffset"
      />
    }
  </svg>
  @if (centerValue()) {
    <div class="absolute flex flex-col items-center text-center px-2">
      <span class="font-numeric text-label-numeric-md text-on-surface font-bold leading-tight">{{
        centerValue()
      }}</span>
      <span class="font-label-caps text-[10px] text-on-surface-variant tracking-wider uppercase">{{
        centerLabel()
      }}</span>
    </div>
  }
</div>
