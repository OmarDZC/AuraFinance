<div class="relative w-36 h-36 flex items-center justify-center flex-shrink-0">
  <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
    <circle
      class="text-surface-container-highest/40"
      cx="50"
      cy="50"
      r="42"
      fill="transparent"
      stroke="currentColor"
      stroke-width="8"
    />
    <circle
      class="text-primary-container transition-all duration-700"
      cx="50"
      cy="50"
      r="42"
      fill="transparent"
      stroke="currentColor"
      stroke-width="8"
      stroke-linecap="round"
      [attr.stroke-dasharray]="circumference"
      [attr.stroke-dashoffset]="dashOffset()"
    />
  </svg>
  <div class="absolute flex flex-col items-center text-center">
    <span class="font-heading text-headline-lg text-on-surface font-bold">{{ displayValue() }}%</span>
    <span class="font-label-caps text-[10px] text-on-surface-variant tracking-wider uppercase">{{
      caption()
    }}</span>
  </div>
</div>
