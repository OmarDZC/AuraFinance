<aside
  class="fixed left-0 top-0 h-full w-72 bg-surface-container-lowest/90 backdrop-blur-2xl z-50 flex flex-col justify-between py-space-lg shadow-[0_1px_8px_rgba(0,0,0,0.4)] transition-transform duration-300 ease-out lg:translate-x-0"
  [class.-translate-x-full]="!isOpen()"
>
  <div class="flex flex-col gap-space-lg px-space-md overflow-y-auto">
    <!-- Logo + cierre del drawer (solo mobile) -->
    <div class="flex items-center justify-between px-space-sm">
      <div class="flex items-center gap-space-sm">
        <div
          class="w-9 h-9 rounded-full bg-primary-container/10 text-primary flex items-center justify-center flex-shrink-0"
        >
          <span class="material-symbols-outlined text-[20px]">bolt</span>
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-space-xs">
            <span class="font-heading text-headline-md font-bold tracking-tight text-on-surface"
              >Aura</span
            >
            <span
              class="inline-block w-1.5 h-1.5 rounded-full bg-primary-container shadow-[0_0_8px_rgba(5,242,146,0.6)]"
            ></span>
          </div>
          <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest"
            >Flujo Mensual</span
          >
        </div>
      </div>
      <button
        type="button"
        class="lg:hidden p-1.5 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors"
        aria-label="Cerrar navegación"
        (click)="closeRequested.emit()"
      >
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>

    <!-- Navegación -->
    <nav class="flex flex-col gap-space-xs">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-surface-container-high text-primary font-bold shadow-[0_0_12px_rgba(5,242,146,0.08)]"
          #rla="routerLinkActive"
          (click)="onNavigate()"
          class="flex items-center gap-space-sm px-space-md py-space-sm rounded-xl transition-all group hover:bg-surface-container"
        >
          <span
            class="material-symbols-outlined text-[20px] transition-colors group-hover:text-primary"
            [class.text-primary]="rla.isActive"
            [class.text-on-surface-variant]="!rla.isActive"
          >
            {{ item.icon }}
          </span>
          <span
            class="font-sans text-body-md"
            [class.text-on-surface-variant]="!rla.isActive"
          >
            {{ item.label }}
          </span>
        </a>
      }
    </nav>
  </div>

  <!-- Pie: perfil + versión -->
  <div class="px-space-md flex flex-col gap-space-sm">
    <div class="bg-surface-container-low/70 rounded-xl p-space-sm flex items-center gap-space-sm">
      <div class="relative flex-shrink-0">
        <div
          class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant"
        >
          <span class="material-symbols-outlined text-[18px]">person</span>
        </div>
        <span
          class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-secondary-container ring-2 ring-surface-container-lowest"
        ></span>
      </div>
      <div class="flex flex-col overflow-hidden">
        <span class="font-sans text-body-sm font-semibold text-on-surface truncate">Aura Finance</span>
        <span class="font-label-caps text-label-caps text-secondary uppercase">Local</span>
      </div>
    </div>
  </div>
</aside>

@if (isOpen()) {
  <div
    class="fixed inset-0 bg-black/50 z-40 lg:hidden"
    aria-hidden="true"
    (click)="closeRequested.emit()"
  ></div>
}
